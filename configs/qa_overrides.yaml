decisions:
  "2026-광고-04-0044":
    reviewed_rule_ids:
      - AD_REVIEW_ART18_P2_I1
    artifact_text: "유선 케이블을 연결해 충전하는 주방용품 광고에서 ‘무선 USB 충전 시스템’, ‘무선 충전 시스템 내장’이라는 문구를 표시한다."
    rationale: "유선 케이블을 이용해 충전하는 제품이지만, 해당 문구만으로 충전 패드 방식의 무선충전 제품으로 잘못 인식될 우려는 크지 않다고 판단했다."
    note: "공식 표에는 관련조항이 없으나, 무선 충전 표현의 진실성 여부를 검토한 문제없음 사례로 수동 연결한 경계 사례"
